name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

      # release-please parses every commit with a conventional-commit grammar, and a commit it
      # cannot parse is dropped from the changelog while this job still reports success. That
      # silently cost #211 its changelog entry; because it was the only user-facing commit at the
      # time, no release PR was opened at all and the omission went unnoticed for hours.
      # This checks the outcome rather than the prose: if unreleased feat:/fix: commits exist,
      # release-please must have produced a release PR or cut a release.
      - name: Checkout
        if: ${{ !steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify no releasable commit was silently dropped
        if: ${{ !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            echo "No tag yet; nothing to verify."
            exit 0
          fi

          releasable=$(git log "$last_tag"..HEAD --format=%s | grep -cE '^(feat|fix)(\(.+\))?!?:' || true)
          if [ "$releasable" -eq 0 ]; then
            echo "No releasable commits since $last_tag."
            exit 0
          fi

          if gh pr list --state open --json title --jq '.[].title' | grep -qE '^chore\(main\): release'; then
            echo "$releasable releasable commit(s) since $last_tag, and a release PR is open."
            exit 0
          fi

          echo "::error::$releasable releasable commit(s) exist since $last_tag but release-please produced no release PR. A commit it could not parse is dropped from the changelog while this job still succeeds. Check the Release Please step log for 'commit could not be parsed'."
          git log "$last_tag"..HEAD --format='  %h %s' | grep -E '(feat|fix)' || true
          exit 1

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build AI.Sentinel.slnx -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test AI.Sentinel.slnx -c Release --no-build

      - name: Pack
        run: |
          for proj in \
            src/AI.Sentinel/AI.Sentinel.csproj \
            src/AI.Sentinel.Approvals.EntraPim/AI.Sentinel.Approvals.EntraPim.csproj \
            src/AI.Sentinel.Approvals.Sqlite/AI.Sentinel.Approvals.Sqlite.csproj \
            src/AI.Sentinel.AspNetCore/AI.Sentinel.AspNetCore.csproj \
            src/AI.Sentinel.AzureSentinel/AI.Sentinel.AzureSentinel.csproj \
            src/AI.Sentinel.ClaudeCode/AI.Sentinel.ClaudeCode.csproj \
            src/AI.Sentinel.ClaudeCode.Cli/AI.Sentinel.ClaudeCode.Cli.csproj \
            src/AI.Sentinel.Cli/AI.Sentinel.Cli.csproj \
            src/AI.Sentinel.Copilot/AI.Sentinel.Copilot.csproj \
            src/AI.Sentinel.Copilot.Cli/AI.Sentinel.Copilot.Cli.csproj \
            src/AI.Sentinel.Detectors.Sdk/AI.Sentinel.Detectors.Sdk.csproj \
            src/AI.Sentinel.Mcp/AI.Sentinel.Mcp.csproj \
            src/AI.Sentinel.Mcp.Cli/AI.Sentinel.Mcp.Cli.csproj \
            src/AI.Sentinel.OpenTelemetry/AI.Sentinel.OpenTelemetry.csproj \
            src/AI.Sentinel.Sqlite/AI.Sentinel.Sqlite.csproj; do
            dotnet pack "$proj" -c Release --no-build \
              -p:PackageVersion=${{ needs.release-please.outputs.version }} \
              -o ./nupkg
          done

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload to GitHub Release
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./nupkg/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
