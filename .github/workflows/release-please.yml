name: Release Please

on:
  push:
    branches: [main]
  # Republishes an existing release whose publish job failed, for example 5.1.2 after an expired NuGet key.
  # It builds the tag's code but runs main's workflow file, which the NuGet trusted publishing policy names.
  workflow_dispatch:
    inputs:
      version:
        description: Version of the existing release to publish, without the leading v, for example 5.1.2.
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: simple
          token: ${{ steps.app-token.outputs.token }}

      # release-please parses every commit with a conventional-commit grammar, and a commit it
      # cannot parse is dropped from the changelog while this job still reports success. That
      # silently cost #211 its changelog entry; because it was the only user-facing commit at the
      # time, no release PR was opened at all and the omission went unnoticed for hours.
      # This checks the outcome rather than the prose: if unreleased feat:/fix: commits exist,
      # release-please must have produced a release PR or cut a release.
      - name: Checkout
        if: ${{ !steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify no releasable commit was silently dropped
        if: ${{ !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            echo "No tag yet; nothing to verify."
            exit 0
          fi

          releasable=$(git log "$last_tag"..HEAD --format=%s | grep -cE '^(feat|fix)(\(.+\))?!?:' || true)
          if [ "$releasable" -eq 0 ]; then
            echo "No releasable commits since $last_tag."
            exit 0
          fi

          if gh pr list --state open --json title --jq '.[].title' | grep -qE '^chore\(main\): release'; then
            echo "$releasable releasable commit(s) since $last_tag, and a release PR is open."
            exit 0
          fi

          echo "::error::$releasable releasable commit(s) exist since $last_tag but release-please produced no release PR. A commit it could not parse is dropped from the changelog while this job still succeeds. Check the Release Please step log for 'commit could not be parsed'."
          git log "$last_tag"..HEAD --format='  %h %s' | grep -E '(feat|fix)' || true
          exit 1

  native:
    # Packs, smoke-tests, archives and attests the Native AOT builds of the three hook/MCP CLIs,
    # one runner per RID. Nothing is pushed unless every leg succeeds.
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/native-cli.yml
    with:
      version: ${{ needs.release-please.outputs.version || inputs.version }}
      ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || '' }}
      attest: true

  publish:
    needs: [release-please, native]
    if: ${{ !cancelled() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.release-please.outputs.version || inputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || '' }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build AI.Sentinel.slnx -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test AI.Sentinel.slnx -c Release --no-build

      - name: Pack libraries and the sentinel CLI
        run: |
          for proj in \
            src/AI.Sentinel/AI.Sentinel.csproj \
            src/AI.Sentinel.Approvals.EntraPim/AI.Sentinel.Approvals.EntraPim.csproj \
            src/AI.Sentinel.Approvals.Sqlite/AI.Sentinel.Approvals.Sqlite.csproj \
            src/AI.Sentinel.AspNetCore/AI.Sentinel.AspNetCore.csproj \
            src/AI.Sentinel.AzureSentinel/AI.Sentinel.AzureSentinel.csproj \
            src/AI.Sentinel.ClaudeCode/AI.Sentinel.ClaudeCode.csproj \
            src/AI.Sentinel.Cli/AI.Sentinel.Cli.csproj \
            src/AI.Sentinel.Copilot/AI.Sentinel.Copilot.csproj \
            src/AI.Sentinel.Detectors.Sdk/AI.Sentinel.Detectors.Sdk.csproj \
            src/AI.Sentinel.Mcp/AI.Sentinel.Mcp.csproj \
            src/AI.Sentinel.OpenTelemetry/AI.Sentinel.OpenTelemetry.csproj \
            src/AI.Sentinel.Sqlite/AI.Sentinel.Sqlite.csproj; do
            dotnet pack "$proj" -c Release --no-build \
              -p:PackageVersion=$VERSION \
              -o ./nupkg
          done

      # The three hook/MCP CLIs are RID-specific tools (eng/NativeTool.props): a pointer package,
      # one Native AOT package per RID from the native job, and a framework-dependent any fallback.
      - name: Pack the CLI pointer and any packages
        run: |
          for cli in ClaudeCode.Cli Copilot.Cli Mcp.Cli; do
            proj=src/AI.Sentinel.$cli/AI.Sentinel.$cli.csproj
            dotnet pack "$proj" -c Release --no-build -p:PackageVersion=$VERSION -o ./nupkg-pointer
            dotnet pack "$proj" -c Release -r any -p:PublishAot=false \
              -p:PackageVersion=$VERSION -p:Version=$VERSION -o ./nupkg-rid
          done

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./native
          merge-multiple: true

      - name: Collect the RID packages
        run: mv ./native/*.nupkg ./nupkg-rid/

      # A pointer package names its RID packages, and `dotnet tool install` fails outright on a RID
      # whose package is missing. Check that every named package was built, push them all, wait
      # until NuGet serves each one, and push the pointers last.
      - name: Check every RID package a pointer names was built
        run: |
          for ptr in ./nupkg-pointer/*.nupkg; do
            ids=$(unzip -p "$ptr" tools/any/any/DotnetToolSettings.xml | grep -o 'Id="[^"]*"' | cut -d'"' -f2)
            [ -n "$ids" ] || { echo "::error::$(basename "$ptr") names no RID packages"; exit 1; }
            for id in $ids; do
              [ -f "./nupkg-rid/$id.$VERSION.nupkg" ] || { echo "::error::$(basename "$ptr") names $id, but $id.$VERSION.nupkg was not built"; exit 1; }
            done
          done

      # Trusted publishing: nuget.org holds a policy for this repository and workflow file, and NuGet/login
      # swaps this job's OIDC token for an API key that lasts about an hour. The wait below can take 30
      # minutes, so the second push stage logs in again. NUGET_USER is the nuget.org profile name.
      - name: Log in to NuGet for the RID packages
        id: nuget-login-rid
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the RID packages to NuGet
        run: dotnet nuget push "./nupkg-rid/*.nupkg" --api-key ${{ steps.nuget-login-rid.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # NuGet validates and indexes each package on its own schedule, so push order alone does not
      # make a large RID package available before the small pointer that names it.
      - name: Wait until NuGet serves every RID package
        run: |
          for f in ./nupkg-rid/*.nupkg; do
            id=$(basename "$f" ".$VERSION.nupkg" | tr '[:upper:]' '[:lower:]')
            for attempt in $(seq 1 60); do
              if curl -fsS "https://api.nuget.org/v3-flatcontainer/$id/index.json" 2>/dev/null | grep -q "\"$VERSION\""; then
                continue 2
              fi
              sleep 30
            done
            echo "::error::$id $VERSION is not available on NuGet after 30 minutes; the pointer packages were not pushed"
            exit 1
          done

      - name: Log in to NuGet for the libraries and pointers
        id: nuget-login-libs
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the libraries and the CLI pointer packages to NuGet
        run: |
          dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ steps.nuget-login-libs.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkg-pointer/*.nupkg" --api-key ${{ steps.nuget-login-libs.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Write SHA256SUMS
        working-directory: ./native
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./native/SHA256SUMS

      - name: Upload to GitHub Release
        run: |
          gh release upload "$TAG" --clobber \
            ./native/*.tar.gz ./native/*.zip ./native/SHA256SUMS \
            ./nupkg/*.nupkg ./nupkg-pointer/*.nupkg ./nupkg-rid/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A CycloneDX SBOM of the solution, attached to the same release. release-please created the release in the
      # release-please job, and this job runs on main, so the tag comes from that job's tag_name output, or from the dispatch input when republishing.
      - name: Attach the SBOM to the GitHub release
        uses: MarcelRoozekrans/ci-baseline/actions/sbom@v1
        with:
          solution: AI.Sentinel.slnx
          tag: ${{ env.TAG }}
