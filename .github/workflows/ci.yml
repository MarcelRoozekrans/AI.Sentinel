name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload via OIDC, no token secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Whitespace and charset follow .editorconfig; folder mode needs no restore or build.
      - name: Check formatting
        run: dotnet format whitespace . --folder --verify-no-changes

      - name: Restore
        run: dotnet restore AI.Sentinel.slnx

      - name: Build
        run: dotnet build AI.Sentinel.slnx --no-restore -c Release

      # The Art. 5 evaluation tool is outside the solution because running it downloads a model,
      # but it reads AI.Sentinel internals, so build it to catch drift. Build only: nothing runs it here.
      - name: Build compliance evaluation tool
        run: dotnet build tools/AI.Sentinel.ComplianceEval/AI.Sentinel.ComplianceEval.csproj -c Release

      - name: Test
        # One Cobertura file per test app and target framework; Codecov merges them.
        run: dotnet test AI.Sentinel.slnx --no-build -c Release --verbosity normal --coverage --coverage-output-format cobertura --coverage-settings coverage.config.xml --results-directory TestResults

      - name: Upload coverage to Codecov
        if: '!cancelled()'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: "TestResults/**/*.cobertura.xml"
          disable_search: true   # only the files above, not every *.xml the search finds
          fail_ci_if_error: false
