name: Native CLI

# Builds the Native AOT tool package of sentinel-hook, sentinel-copilot-hook and sentinel-mcp for
# each RID on a runner of that OS (Native AOT cannot cross-compile between operating systems),
# extracts the binary from the package, smoke-tests it and archives it. The PR check
# (aot-publish.yml) and the release (release-please.yml) both call this workflow, so a PR
# exercises exactly the bits a release pushes to NuGet and attaches to the GitHub release.
#
# Permissions are inherited from the caller: the release grants id-token and attestations
# write for the provenance attestation, the PR check does not and passes attest: false.

on:
  workflow_call:
    inputs:
      version:
        description: Package and assembly version, the same for every RID and the pointer package.
        type: string
        required: true
      attest:
        description: Attest build provenance for each archive.
        type: boolean
        default: false

jobs:
  native:
    name: ${{ matrix.cli.command }} ${{ matrix.target.rid }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        cli:
          - { id: ClaudeCode.Cli, command: sentinel-hook, kind: hook }
          - { id: Copilot.Cli, command: sentinel-copilot-hook, kind: copilot-hook }
          - { id: Mcp.Cli, command: sentinel-mcp, kind: mcp }
        target:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: win-x64, os: windows-latest }

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack the ${{ matrix.target.rid }} tool package
        shell: pwsh
        run: |
          dotnet pack src/AI.Sentinel.${{ matrix.cli.id }}/AI.Sentinel.${{ matrix.cli.id }}.csproj `
            -c Release `
            -r ${{ matrix.target.rid }} `
            -p:PackageVersion=${{ inputs.version }} `
            -p:Version=${{ inputs.version }} `
            -o out
          if ($LASTEXITCODE -ne 0) { throw "Pack failed" }

      - name: Extract the native binary from the package
        id: extract
        shell: pwsh
        run: |
          $rid = '${{ matrix.target.rid }}'
          $pkg = Get-Item "out/AI.Sentinel.${{ matrix.cli.id }}.$rid.${{ inputs.version }}.nupkg"
          # Expand-Archive only accepts a .zip extension.
          Copy-Item $pkg.FullName pkg.zip
          Expand-Archive pkg.zip -DestinationPath pkg
          $dir = Get-ChildItem pkg/tools -Recurse -Directory | Where-Object { $_.Name -eq $rid } | Select-Object -First 1
          if (-not $dir) { Get-ChildItem pkg -Recurse | ForEach-Object FullName; throw "No tools/*/$rid folder in $($pkg.Name)" }
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $assembly = "AI.Sentinel.${{ matrix.cli.id }}$ext"
          if (-not (Test-Path (Join-Path $dir.FullName $assembly))) { Get-ChildItem $dir.FullName | ForEach-Object Name; throw "No $assembly in $($dir.FullName)" }
          # Ship the binary under its command name, plus any native library the package places beside it.
          # Debug symbols and the tool manifest stay out of the archive.
          New-Item -ItemType Directory dist | Out-Null
          Get-ChildItem $dir.FullName -File |
            Where-Object { $_.Extension -notin '.pdb', '.dbg', '.xml' -and $_.Name -ne $assembly } |
            Copy-Item -Destination dist
          Copy-Item (Join-Path $dir.FullName $assembly) "dist/${{ matrix.cli.command }}$ext"
          Write-Host "Archive contents:"; Get-ChildItem dist | ForEach-Object { "  $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
          "binary=dist/${{ matrix.cli.command }}$ext" >> $env:GITHUB_OUTPUT

      - name: Smoke test
        shell: pwsh
        run: ./eng/smoke-native.ps1 -Binary '${{ steps.extract.outputs.binary }}' -Kind ${{ matrix.cli.kind }}

      - name: Archive
        id: archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts | Out-Null
          $base = "${{ matrix.cli.command }}-${{ inputs.version }}-${{ matrix.target.rid }}"
          if ($IsWindows) {
            $archive = "artifacts/$base.zip"
            Compress-Archive -Path dist/* -DestinationPath $archive
          } else {
            $archive = "artifacts/$base.tar.gz"
            tar -czf $archive -C dist .
            if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          }
          Copy-Item "out/AI.Sentinel.${{ matrix.cli.id }}.${{ matrix.target.rid }}.${{ inputs.version }}.nupkg" artifacts/
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.archive.outputs.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.cli.id }}-${{ matrix.target.rid }}
          path: artifacts/
          if-no-files-found: error
